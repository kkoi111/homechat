<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="我们家">
<meta name="theme-color" content="#b2c7da">
<title>我们家</title>
<style>
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;
  --bg:#b2c7da; --ink:#191919; --muted:#556677; --line:rgba(0,0,0,.07);
  --mine:#fee500; --mine-ink:#191919; --theirs:#fff; --theirs-ink:#191919;
  --panel:#fff; --field:#f4f5f7; --day:rgba(0,0,0,.14); --yellow:#fee500;
  --yiyi:#f29abf; --ren:#5fb3a1; --kai:#d8b48a; --fs:15px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#2e3a46;--ink:#f1f1f1;--muted:#a9b7c4;--line:rgba(255,255,255,.08);
    --theirs:#454f5a;--theirs-ink:#f1f1f1;--panel:#232a31;--field:#323b45;--day:rgba(0,0,0,.25)}
}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font:16px/1.45 var(--font);background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid #3a7bd5;outline-offset:2px}

/* 头像 */
.av{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:38%;
  color:#fff;font-weight:600;font-size:16px;background-size:cover;background-position:center;cursor:pointer;border:0;padding:0}
.av.yiyi{background-color:var(--yiyi)} .av.ren{background-color:var(--ren)} .av.kai{background-color:var(--kai)} .av.other{background-color:#9aa}
.av.img{color:transparent}

/* 顶栏 */
header{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:var(--bg);border-bottom:1px solid var(--line)}
.faces{display:flex;flex:none;background:none;border:0;padding:0;cursor:pointer}
.faces .av{width:32px;height:32px;font-size:13px;border:2px solid var(--bg)}
.faces .av+.av{margin-left:-10px}
.head{flex:1;text-align:left;background:none;border:0;padding:0;cursor:pointer}
h1{margin:0;font-size:17px;font-weight:650;line-height:1.2}
#status{font-size:12px;color:var(--muted)}
.icon{width:40px;height:40px;flex:none;border:0;border-radius:50%;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.icon svg{width:21px;height:21px}

/* 消息 */
#scroller{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#list{max-width:680px;margin:0 auto;padding:12px 12px 18px;display:flex;flex-direction:column}
.day{align-self:center;margin:14px 0 6px;padding:3px 12px;border-radius:999px;background:var(--day);color:#fff;font-size:12px}
.msg{display:flex;gap:8px;align-items:flex-start;max-width:82%;margin-top:12px}
.msg.cont{margin-top:4px}
.msg.cont .av{visibility:hidden;height:0}
.msg.cont .name{display:none}
.col{display:flex;flex-direction:column}
.name{font-size:calc(var(--fs) - 3px);color:var(--muted);margin:0 2px 4px}
.line{display:flex;align-items:flex-end;gap:5px}
.bubble{font-size:var(--fs);line-height:1.45;padding:8px 12px;background:var(--theirs);color:var(--theirs-ink);border-radius:4px 14px 14px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.cont .bubble{border-radius:14px}
.time{flex:none;font-size:calc(var(--fs) - 4.5px);color:var(--muted);white-space:nowrap;padding-bottom:1px}
.msg.mine{align-self:flex-end}
.msg.mine .av,.msg.mine .name{display:none}
.msg.mine .line{flex-direction:row-reverse}
.msg.mine .bubble{background:var(--mine);color:var(--mine-ink);border-radius:14px 4px 14px 14px}
.msg.mine.cont .bubble{border-radius:14px}
@media (prefers-reduced-motion:no-preference){.msg.new{animation:pop .3s cubic-bezier(.2,.9,.3,1.2) backwards}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}}
.empty{margin:30vh auto 0;color:var(--muted);font-size:14px;text-align:center}

/* 输入 */
#composer{background:var(--panel);padding:8px 10px calc(env(safe-area-inset-bottom) + 8px)}
#composer .row{max-width:680px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
#input{flex:1;min-height:40px;max-height:130px;resize:none;border:0;border-radius:20px;padding:9px 15px;background:var(--field);font-size:16px;line-height:1.35}
#send{flex:none;height:40px;min-width:58px;padding:0 14px;border:0;border-radius:20px;background:var(--yellow);color:#191919;font-weight:650;cursor:pointer}
#send:disabled{background:var(--field);color:var(--muted)}

/* 表情包 */
.stk{display:block;max-width:140px;max-height:140px;border-radius:10px}
#stkBtn{width:40px;height:40px}
#stkBtn[aria-expanded=true]{color:var(--ink)}
#stkBtn[hidden]{display:none}
#stkPanel{max-width:680px;margin:0 auto 8px;display:none;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;max-height:240px;overflow-y:auto;padding:2px}
#stkPanel.show{display:grid}
#stkPanel button{aspect-ratio:1;border:0;padding:5px;border-radius:12px;background:var(--field);cursor:pointer;display:grid;place-items:center}
#stkPanel img{max-width:100%;max-height:100%;object-fit:contain}
#stkPanel .stk-add{font-size:30px;line-height:1;color:var(--muted);background:transparent;border:2px dashed var(--line)}
#addStk textarea{width:100%;min-height:70px;padding:10px 14px;border-radius:12px;border:0;background:var(--field);font-size:16px;resize:none}
#stkPreview{display:block;margin:0 auto;max-width:140px;max-height:140px;border-radius:10px}
#stkPreview[hidden]{display:none}
#addStk .card{max-height:100%;overflow-y:auto}

/* 引用 和 @ */
.quote{font-size:calc(var(--fs) - 3px);color:var(--muted);background:rgba(0,0,0,.06);border-left:3px solid var(--muted);border-radius:6px;padding:4px 8px;margin:0 0 4px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.msg.mine .col{align-items:flex-end}
.msg.flash .bubble,.msg.flash .stk{outline:2px solid #f5a623;outline-offset:2px}
.bubble,.stk{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#replyBar{max-width:680px;margin:0 auto 6px;display:none;align-items:center;gap:8px;padding:6px 6px 6px 12px;border-radius:12px;background:var(--field);font-size:13px;color:var(--muted)}
#replyBar.show{display:flex}
#replyText{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#replyBar button{border:0;background:none;font-size:20px;line-height:1;padding:2px 8px;color:var(--muted);cursor:pointer}
.msg{position:relative;touch-action:pan-y}
.swipe-ico{position:absolute;left:-30px;top:50%;transform:translateY(-50%);opacity:0;font-size:18px;color:var(--muted);pointer-events:none}
#scroller{overflow-x:hidden}
/* 小动作 */
.event{align-self:center;margin:10px 0 2px;padding:2px 10px;color:var(--muted);font-size:calc(var(--fs) - 3px);font-weight:300;letter-spacing:.02em;text-align:center}
#list .av{touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#radial{position:fixed;inset:0;z-index:25;display:none;background:rgba(0,0,0,0);transition:background .2s}
#radial.open{background:rgba(0,0,0,.18)}
#radial.show{display:block}
#radial .rb{position:absolute;width:48px;height:48px;margin:-24px 0 0 -24px;border:0;border-radius:50%;background:var(--panel);color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.18);display:grid;place-items:center;cursor:pointer;
  transform:translate(var(--dx),var(--dy)) scale(1);transition:transform .22s cubic-bezier(.2,1.3,.4,1),background .12s,color .12s;transition-delay:var(--d)}
#radial:not(.open) .rb{transform:translate(0,0) scale(.3);transition-delay:0s}
#radial .rb.on{background:#8e959e;color:#fff;transform:translate(var(--dx),var(--dy)) scale(1.24);box-shadow:0 0 0 5px rgba(142,149,158,.28),0 8px 20px rgba(0,0,0,.2)}
#radial .rb svg{width:24px;height:24px}
#radial .rlabel{position:absolute;transform:translate(-50%,-50%);padding:4px 12px;border-radius:999px;background:rgba(25,25,25,.82);color:#fff;font-size:13px;white-space:nowrap;opacity:0;transition:opacity .15s;pointer-events:none}
#radial.open .rlabel{opacity:1}
#hap{position:fixed;left:-100px;top:0;opacity:0;pointer-events:none}
@keyframes fxUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-170%) scale(1)}}
@media (prefers-reduced-motion:no-preference){
  .av.fx-kiss{animation:fxKiss 1.8s}
  .av.fx-squish{animation:fxShrink 3.4s cubic-bezier(.3,1.4,.5,1)}
  .av.fx-poke{animation:fxPokeAway 2s cubic-bezier(.3,1.3,.5,1)}
  .av.fx-kick{animation:fxKick 3.8s}
}
@keyframes fxKiss{15%{transform:scale(1.08)}30%{transform:scale(1)}}
@keyframes fxShrink{0%{transform:scale(1)}8%{transform:scale(.5)}88%{transform:scale(.5)}100%{transform:scale(1)}}
@keyframes fxPokeAway{0%{transform:none}12%{transform:translate(var(--px),var(--py)) rotate(var(--pr))}78%{transform:translate(var(--px),var(--py)) rotate(var(--pr))}100%{transform:none}}
@keyframes fxKick{0%{transform:none;opacity:1}6%{transform:scale(.88,1.1)}20%{transform:translate(90px,-80px) rotate(300deg) scale(.4);opacity:0}84%{transform:translate(-36px,0) scale(.8);opacity:0}100%{transform:none;opacity:1}}
.heart-ring{position:fixed;z-index:30;pointer-events:none;width:0;height:0}
.heart-ring svg{position:absolute;width:var(--hs);height:var(--hs);margin:calc(var(--hs) / -2) 0 0 calc(var(--hs) / -2);color:#f29abf;transform:translate(var(--x),var(--y)) scale(0);animation:ringPop 1.9s cubic-bezier(.3,1.5,.5,1) forwards;animation-delay:var(--d)}
@keyframes ringPop{12%{transform:translate(var(--x),var(--y)) scale(1.15)}22%,72%{transform:translate(var(--x),var(--y)) scale(1);opacity:1}100%{transform:translate(calc(var(--x) * 1.35),calc(var(--y) * 1.35)) scale(.7);opacity:0}}
/* 每日小结：右下角小胶囊，点开是每个人的分条活动 */
#dayTip{position:absolute;right:14px;bottom:calc(100% + 40px);max-height:55vh;overflow-y:auto;display:flex;flex-direction:column;align-items:stretch;gap:5px;min-width:150px;pointer-events:none}
#dayTip.show{pointer-events:auto}
#dayTip .it{display:grid;grid-template-columns:2.4em auto 1fr auto;column-gap:6px;align-items:baseline;font-variant-numeric:tabular-nums;padding:3px 12px;border-radius:999px;background:color-mix(in srgb,var(--panel) 85%,transparent);box-shadow:0 3px 10px rgba(0,0,0,.1);color:var(--muted);font-size:12px;font-weight:300;white-space:nowrap;
  opacity:0;transform:translateY(8px);transition:opacity .2s,transform .26s cubic-bezier(.2,1.3,.4,1);transition-delay:var(--d)}
#dayTip.show .it{opacity:1;transform:none}
#dayTip .it b{color:var(--ink);font-weight:400}
#dayTip .it .n{grid-column:4;text-align:right}
@keyframes pillNudge{30%{transform:scale(1.12)}60%{transform:scale(.97)}}
#tipPill.nudge{animation:pillNudge .5s}
#tipPill{position:absolute;right:14px;bottom:calc(100% + 8px);padding:3px 10px;border:0;border-radius:999px;background:color-mix(in srgb,var(--panel) 85%,transparent);box-shadow:0 3px 10px rgba(0,0,0,.1);color:var(--muted);font-size:12px;font-weight:300;cursor:pointer;display:none}
#tipPill.show{display:block}
#composer{position:relative}
#msgMenu{position:fixed;z-index:20;display:none;background:var(--panel);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.2);padding:4px}
#msgMenu.show{display:flex}
#msgMenu button{border:0;background:none;padding:9px 16px;font-size:15px;cursor:pointer;border-radius:8px}
#stkError{min-height:18px;text-align:center;color:var(--muted);font-size:14px}

/* 弹层 */
.layer{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.35)}
.layer.show{display:flex}
#setup{background:var(--bg)}
.card{width:100%;max-width:380px;padding:24px 20px;border-radius:22px;background:var(--panel);display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.15)}
.card h2{margin:0;text-align:center;font-size:20px}
.card p{margin:0;text-align:center;color:var(--muted);font-size:14px}
.card label{font-size:13px;color:var(--muted);margin:4px 2px -6px}
.card input{width:100%;height:46px;padding:0 14px;border-radius:12px;border:0;background:var(--field);font-size:16px}
.go{height:48px;border:0;border-radius:14px;background:var(--yellow);color:#191919;font-weight:650;cursor:pointer}
.ghost{height:44px;border:0;border-radius:14px;background:var(--field);cursor:pointer}
.sizes{display:flex;gap:6px}.sizes button{flex:1;height:38px;border:0;border-radius:10px;background:var(--field);cursor:pointer}.sizes button[aria-pressed=true]{background:var(--yellow);color:#191919;font-weight:650}
#setupError{min-height:18px;text-align:center;color:#e5484d;font-size:14px}
.setup-faces{display:flex;justify-content:center}
.setup-faces .av{width:48px;height:48px;font-size:18px;border:3px solid var(--panel)}
.setup-faces .av+.av{margin-left:-12px}

.person{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.person:first-of-type{border-top:0}
.person .av{width:52px;height:52px;font-size:20px;cursor:default}
.person .who{flex:1;height:40px;padding:0 10px;border:0;border-radius:10px;background:var(--field);font-size:16px;font-weight:600}
.person .acts{display:flex;flex-direction:column;gap:4px}
.person .acts button{height:30px;padding:0 10px;border:0;border-radius:10px;background:var(--field);font-size:14px;cursor:pointer}
.person .acts .pick{background:var(--yellow);color:#191919;font-weight:600}
</style>
</head>
<body>
<header>
  <button class="faces" id="facesBtn" type="button" aria-label="换头像">
    <span class="av yiyi" data-id="yiyi">衣</span><span class="av ren" data-id="ren">蓮</span><span class="av kai" data-id="kai">宝</span>
  </button>
  <button class="head" id="headBtn" type="button"><h1 id="title">我们家</h1><div id="status" role="status"></div></button>
  <button class="icon" id="settingsBtn" type="button" aria-label="设置">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>

<div id="scroller"><div id="list"></div></div>

<div id="msgMenu" role="menu"><button type="button" id="mmQuote" role="menuitem">引用</button><button type="button" id="mmCopy" role="menuitem">复制</button></div>

<form id="composer">
  <div id="dayTip" role="status"></div>
  <button type="button" id="tipPill" aria-label="打开今日小结"></button>
  <div id="replyBar"><span id="replyText"></span><button type="button" id="replyClose" aria-label="取消引用">×</button></div>
  <div id="stkPanel" aria-label="表情包"></div>
  <div class="row">
    <button class="icon" id="stkBtn" type="button" aria-label="表情包" aria-expanded="false" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M8 14.5s1.5 2 4 2 4-2 4-2"/><path d="M9 9.5h.01M15 9.5h.01"/></svg>
    </button>
    <textarea id="input" rows="1" maxlength="4000" placeholder="说点什么…" aria-label="消息"></textarea>
    <button id="send" type="submit">发送</button>
  </div>
</form>

<div class="layer" id="setup">
  <div class="card">
    <div class="setup-faces" aria-hidden="true">
      <span class="av yiyi" data-id="yiyi">衣</span><span class="av ren" data-id="ren">蓮</span><span class="av kai" data-id="kai">宝</span>
    </div>
    <h2>回家</h2>
    <p>令牌只存在这台手机上</p>
    <label for="baseInput">服务地址</label>
    <input id="baseInput" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false">
    <label for="tokenInput">你的令牌</label>
    <input id="tokenInput" type="password" autocomplete="off" placeholder="群-衣衣 那一串">
    <div id="setupError"></div>
    <button class="go" id="saveSetup" type="button">进门</button>
  </div>
</div>

<div class="layer" id="avatars">
  <div class="card">
    <h2>家里的设置</h2>
    <p>只改这台手机上的显示</p>
    <label for="roomName">群名</label>
    <input id="roomName" maxlength="20" autocomplete="off">
    <label>字号</label>
    <div class="sizes" id="sizes">
      <button type="button" data-fs="14" style="font-size:14px">小</button>
      <button type="button" data-fs="15" style="font-size:15px">中</button>
      <button type="button" data-fs="17" style="font-size:17px">大</button>
    </div>
    <div id="people"></div>
    <button class="ghost" id="avatarsClose" type="button">好了</button>
  </div>
</div>
<input type="file" id="filePick" accept="image/*" hidden>

<label id="hap" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label>
<div id="radial" aria-label="小动作"><div class="rlabel" id="rlabel"></div></div>

<div class="layer" id="addStk">
  <div class="card">
    <h2>添加表情包</h2>
    <img id="stkPreview" alt="预览" hidden>
    <button class="ghost" id="stkPickBtn" type="button">选一张图</button>
    <input type="file" id="stkFile" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
    <label for="stkName">名字（发的时候用）</label>
    <input id="stkName" maxlength="20" autocomplete="off" placeholder="比如：偷笑">
    <label for="stkDesc">备注（图上是什么，什么时候用）</label>
    <textarea id="stkDesc" maxlength="200" placeholder="给蓮和小宝看的，写清楚他们才挑得准"></textarea>
    <div id="stkError" role="status"></div>
    <button class="go" id="stkSave" type="button">加进去</button>
    <button class="ghost" id="stkCancel" type="button">算了</button>
  </div>
</div>

<script>
{
  const DEFAULT_BASE = "https://sixkoxtwsslrnrfythmr.supabase.co/functions/v1/chat-mcp";
  const PEOPLE = [
    { id: "yiyi", name: "衣衣", ch: "衣" },
    { id: "ren", name: "蓮", ch: "蓮" },
    { id: "kai", name: "小宝", ch: "宝" },
  ];
  const BY_ID = Object.fromEntries(PEOPLE.map((p) => [p.id, p]));
  const POLL_MS = 4000;

  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); return true; } catch { return false; } },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };

  let cfg = { base: store.get("hc.base") || DEFAULT_BASE, token: store.get("hc.token") || "" };
  let me = null, roomId = "", lastId = null, msgs = [], timer = null, busy = false, seq = 0;

  /* ---------- 头像 ---------- */
  const avatarOf = (id) => store.get("hc.av." + id);
  const nickOf = (id) => store.get("hc.nick." + id);
  let serverRoomName = "我们家";
  const roomTitle = () => store.get("hc.title") || serverRoomName;
  function paintTitle() { $("title").textContent = roomTitle(); document.title = roomTitle(); }

  function paintAvatar(el, id, fallbackName) {
    const p = BY_ID[id];
    const img = avatarOf(id);

  function shrink(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const im = new Image();
      im.onload = () => {
        const S = 192, c = document.createElement("canvas");
        c.width = c.height = S;
        const side = Math.min(im.naturalWidth, im.naturalHeight);
        const sx = (im.naturalWidth - side) / 2, sy = (im.naturalHeight - side) / 2;
        c.getContext("2d").drawImage(im, sx, sy, side, side, 0, 0, S, S);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL("image/jpeg", 0.85));
      };
      im.onerror = () => { URL.revokeObjectURL(url); reject(new Error("读不了这张图")); };
      im.src = url;
    });
  }

  async function call(name, args = {}) {
    const res = await fetch(cfg.base.replace(/\/+$/, "") + "/" + encodeURIComponent(cfg.token), {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json, text/event-stream" },
      body: JSON.stringify({ jsonrpc: "2.0", id: ++seq, method: "tools/call", params: { name, arguments: args } }),
    });
    if (res.status === 401) throw Object.assign(new Error("令牌不对"), { auth: true });
    if (!res.ok) throw new Error("服务器返回 " + res.status);
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    if (data.result.isError) throw new Error(data.result.content?.[0]?.text || "出错了");
    return data.result.structuredContent || {};
  }

  // GIF 原样上传（保留动图）；小图原样；大图缩到 512px 以内
  function prepareImage(file) {
    return new Promise((resolve, reject) => {
      const type = (file.type || "").toLowerCase();
      const ok = ["image/png", "image/jpeg", "image/gif", "image/webp"];
      if (type === "image/gif" || (ok.includes(type) && file.size <= 300 * 1024)) {
        if (file.size > 3.5 * 1024 * 1024) return reject(new Error("动图太大了，要小于 3.5 MB"));
        return resolve({ blob: file, type });
      }
      const url = URL.createObjectURL(file);
      const im = new Image();
      im.onload = () => {
        const MAX = 512, k = Math.min(1, MAX / Math.max(im.naturalWidth, im.naturalHeight));
        const c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(im.naturalWidth * k));
        c.height = Math.max(1, Math.round(im.naturalHeight * k));
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob((png) => {
          if (png && png.size <= 600 * 1024) return resolve({ blob: png, type: "image/png" });
          c.toBlob((jpg) => jpg ? resolve({ blob: jpg, type: "image/jpeg" }) : reject(new Error("压缩失败")), "image/jpeg", 0.85);
        }, "image/png");
      };
      im.onerror = () => { URL.revokeObjectURL(url); reject(new Error("读不了这张图")); };
      im.src = url;
    });
  }
  const toBase64 = (blob) => new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).replace(/^data:[^,]*,/, ""));
    r.onerror = () => reject(new Error("读不了这张图"));
    r.readAsDataURL(blob);
  });

  /* ---------- 小动作 ---------- */
  // 消息里单独一行 [互动:动作:对象id]，比如 [互动:捏一捏:ren]
  const ACTS = [
    { k: "亲亲", ch: "亲", v: "亲了亲", fx: "kiss", c: "#f06a9b" },
    { k: "捏捏", ch: "捏", v: "捏了捏", fx: "squish", c: "#f29a3e" },
    { k: "戳戳", ch: "戳", v: "戳了戳", fx: "poke", c: "#4f8ef7" },
    { k: "踢飞", ch: "踢", v: "一脚踢飞了", fx: "kick", c: "#e5484d" },
  ];
  const ICON_ATTR = 'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"';
  const ICON = {
    // 爱心
    kiss: '<path fill="currentColor" d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"/>',

    squish: '<path d="M3.8 4.3 13.3 8.5A1.9 1.9 0 0 1 11.7 11.9L2.2 7.7"/><path d="M3.8 19.7 13.3 15.5A1.9 1.9 0 0 0 11.7 12.1L2.2 16.3"/><path d="M16.4 12h2.4M16.6 9.1l1.9-1M16.6 14.9l1.9 1"/>',
    // 一根手指
    poke: '<path d="M2.6 18.6 12.6 8.6A2 2 0 0 1 15.4 11.4L5.4 21.4"/><path d="M17.3 6.7l1.7-1.7M18.4 10.4h2.4M13.6 5.6V3.2"/>',
    // 爪子脚印
    kick: '<path d="M7.6 17.6c0-2.6 2-4.8 4.4-4.8s4.4 2.2 4.4 4.8c0 1.5-1.1 2.2-2.2 2.2-.9 0-1.3-.5-2.2-.5s-1.3.5-2.2.5c-1.1 0-2.2-.7-2.2-2.2z"/><ellipse cx="5.6" cy="11.2" rx="1.6" ry="2.1" transform="rotate(-25 5.6 11.2)"/><ellipse cx="9.4" cy="6.9" rx="1.7" ry="2.3" transform="rotate(-8 9.4 6.9)"/><ellipse cx="14.6" cy="6.9" rx="1.7" ry="2.3" transform="rotate(8 14.6 6.9)"/><ellipse cx="18.4" cy="11.2" rx="1.6" ry="2.1" transform="rotate(25 18.4 11.2)"/>',
  };
  const svgOf = (fx) => "<svg " + ICON_ATTR + ">" + ICON[fx] + "</svg>";
  // iPhone 网页不支持震动接口，借 iOS 开关控件自带的触感：点一下隐藏的开关就会“咔哒”一下
  function haptic() {
    try { if (navigator.vibrate) navigator.vibrate(10); } catch {}
    try { $("hap").click(); } catch {}
  }
  const ACT_BY = Object.fromEntries(ACTS.map((a) => [a.k, a]));
  const EVT = /^\[互动:([^:\]]+):([a-z]+)\]$/;

  // ---- 长按头像，头顶弹出一圈圆形菜单；按住滑过去松手就选中，也可以松手后再点 ----
  const radial = $("radial"), rlabel = $("rlabel");
  let radialTarget = null, radialHot = null, radialDragging = false, longPressed = false;
  for (const a of ACTS) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "rb";
    b.dataset.k = a.k;
    b.setAttribute("aria-label", a.k);
    b.innerHTML = svgOf(a.fx);
    b.style.setProperty("--c", a.c);
    b.addEventListener("click", () => chooseAct(a.k));
    radial.append(b);
  }
  function openRadial(targetId, rect) {
    radialTarget = targetId;
    const R = 84, pad = 28;
    let cx = rect.left + rect.width / 2;
    cx = Math.max(R + pad, Math.min(cx, innerWidth - R - pad));
    let cy = rect.top + rect.height / 2;
    const up = cy - R - 40 > 0; // 上面放不下就往下开
    const A0 = Math.PI * 150 / 180, A1 = Math.PI * 30 / 180; // 四个按钮，弧收窄一点
    const btns = [...radial.querySelectorAll(".rb")];
    btns.forEach((b, i) => {
      const ang = A0 - (i / (btns.length - 1)) * (A0 - A1); // 从左到右一道弧
      b.style.left = cx + "px";
      b.style.top = cy + "px";
      b.style.setProperty("--dx", Math.cos(ang) * R + "px");
      b.style.setProperty("--dy", (up ? -1 : 1) * Math.sin(ang) * R + "px");
      b.style.setProperty("--d", (i * 0.018) + "s");
      b.classList.remove("on");
    });
    rlabel.style.left = cx + "px";
    rlabel.style.top = (cy + (up ? -R * 0.35 : R * 0.35)) + "px";
    rlabel.textContent = "对" + personName(targetId) + "…";
    radial.classList.add("show");
    requestAnimationFrame(() => radial.classList.add("open"));
    haptic();
  }
  function closeRadial() {
    radial.classList.remove("open", "show");
    radialTarget = null; radialHot = null; radialDragging = false;
  }
  function hotAt(x, y) {
    const el = document.elementFromPoint(x, y);
    const b = el && el.closest && el.closest("#radial .rb");
    if (b === radialHot) return;
    if (radialHot) radialHot.classList.remove("on");
    radialHot = b || null;
    if (radialHot) { radialHot.classList.add("on"); rlabel.textContent = radialHot.dataset.k; haptic(); }
    else rlabel.textContent = "对" + personName(radialTarget) + "…";
  }
  function chooseAct(k) {
    const t = radialTarget;
    closeRadial();
    if (!t) return;
    haptic();
    playFx(t, k);
    sendBody("[互动:" + k + ":" + t + "]", false);
  }
  radial.addEventListener("pointerdown", (e) => { if (e.target === radial || e.target === rlabel) closeRadial(); });
  document.addEventListener("pointermove", (e) => { if (radialDragging) hotAt(e.clientX, e.clientY); });
  document.addEventListener("pointerup", () => {
    if (!radialDragging) return;
    radialDragging = false;
    if (radialHot) chooseAct(radialHot.dataset.k); // 滑到某个按钮上松手 = 选中
  });

  function attachAvatar(av, targetId) {
    let t = null;
    av.addEventListener("pointerdown", (e) => {
      e.stopPropagation(); // 别让整行的右滑引用也动起来
      if (e.pointerType === "mouse" && e.button !== 0) return;
      longPressed = false;
      clearTimeout(t);
      t = setTimeout(() => {
        longPressed = true;
        radialDragging = true;
        try { av.releasePointerCapture(e.pointerId); } catch {}
        openRadial(targetId, av.getBoundingClientRect());
      }, 380);
    });
    const cancel = () => clearTimeout(t);
    av.addEventListener("pointerup", cancel);
    av.addEventListener("pointercancel", cancel);
    av.addEventListener("pointerleave", () => { if (!radialDragging) cancel(); });
    av.addEventListener("contextmenu", (e) => e.preventDefault());
    // 轻点一下 = 戳一戳
    av.addEventListener("click", () => {
      if (longPressed) { longPressed = false; return; }
      haptic();
      playFx(targetId, "戳戳");
      sendBody("[互动:戳戳:" + targetId + "]", false);
    });
  }

  // 在对方头像上播动画：顶栏那个，加上聊天里最近一个
  function playFx(targetId, actName, listOnly) {
    const a = ACT_BY[actName];
    if (!a) return;
    const els = listOnly ? [] : [...document.querySelectorAll('.faces .av[data-id="' + targetId + '"]')];
    const inList = [...document.querySelectorAll('#list .av[data-who="' + targetId + '"]')].filter((x) => x.offsetHeight);
    if (inList.length) els.push(inList[inList.length - 1]);
    for (const el of els) {
      el.classList.remove("fx-" + a.fx);
      void el.offsetWidth; // 重新触发动画
      el.classList.add("fx-" + a.fx);
      el.addEventListener("animationend", () => el.classList.remove("fx-" + a.fx), { once: true });
      if (a.fx === "poke") {
        // 往随机一个方向被戳开
        const ang = Math.random() * Math.PI * 2;
        el.style.setProperty("--px", Math.round(Math.cos(ang) * 34) + "px");
        el.style.setProperty("--py", Math.round(Math.sin(ang) * 22) + "px");
        el.style.setProperty("--pr", Math.round((Math.random() - .5) * 40) + "deg");
      }
      if (a.fx === "kiss") heartRing(el.getBoundingClientRect());
    }
  }
  // 亲亲：头像周围围一圈小爱心
  function heartRing(r) {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const ring = document.createElement("div");
    ring.className = "heart-ring";
    ring.style.left = (r.left + r.width / 2) + "px";
    ring.style.top = (r.top + r.height / 2) + "px";
    const n = 8, R = r.width * 0.78, hs = Math.max(10, r.width * 0.3);
    for (let i = 0; i < n; i++) {
      const ang = (i / n) * Math.PI * 2 - Math.PI / 2;
      const h = document.createElement("div");
      h.innerHTML = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 21 5 14C3.5 12.5 2 10.8 2 8.5A5.5 5.5 0 0 1 7.5 3c1.8 0 3 .5 4.5 2 1.5-1.5 2.7-2 4.5-2A5.5 5.5 0 0 1 22 8.5c0 2.3-1.5 4-3 5.5z"/></svg>';
      const sv = h.firstChild;
      sv.style.setProperty("--x", Math.cos(ang) * R + "px");
      sv.style.setProperty("--y", Math.sin(ang) * R + "px");
      sv.style.setProperty("--hs", hs + "px");
      sv.style.setProperty("--d", (i * 0.05) + "s");
      ring.append(sv);
    }
    document.body.append(ring);
    setTimeout(() => ring.remove(), 2400);
  }
  function eventSteps(a, t, fx) {
    if (fx === "squish") return [{ t: a + " 捏了捏 " + t + "，" + t + " 缩成了一小团" }, { t: a + " 捏了捏 " + t + "，" + t + " 又弹回来了", at: 3200 }];
    if (fx === "poke") return [{ t: a + " 戳了戳 " + t + "，" + t + " 被戳到了一边" }, { t: a + " 戳了戳 " + t + "，" + t + " 又挪回来了", at: 1800 }];
    if (fx === "kick") return [{ t: a + " 一脚把 " + t + " 踢飞了" }, { t: a + " 一脚把 " + t + " 踢飞了，" + t + " 自己走回来了", at: 3400 }];
    return [{ t: a + " 亲了亲 " + t }];
  }
  /* ---------- 每日小结 ---------- */
  const TIP_MIN = 10; // 今天累计到这么多下，胶囊才出现
  const TIP_NUDGE = [10, 30, 66, 100]; // 跨过这几道门槛时胶囊跳一下
  const todayKey = () => new Date().toLocaleDateString("zh-CN", { timeZone: "Asia/Singapore" });
  function todayStats() {
    const key = todayKey(), byPerson = new Map();
    let total = 0;
    for (const m of msgs) {
      if (new Date(m.created_at).toLocaleDateString("zh-CN", { timeZone: "Asia/Singapore" }) !== key) continue;
      const ev = String(m.body).trim().match(EVT);
      if (!ev || !ACT_BY[ev[1]]) continue;
      total++;
      if (!byPerson.has(m.author_id)) byPerson.set(m.author_id, new Map());
      const k = ev[1] + "|" + ev[2], mp = byPerson.get(m.author_id);
      mp.set(k, (mp.get(k) || 0) + 1);
    }
    return { total, byPerson };
  }
  const SHORT = { 亲亲: "亲了", 捏捏: "捏了", 戳戳: "戳了", 踢飞: "踢飞" };
  function buildTip(st) {
    const box = $("dayTip");
    box.textContent = "";
    const order = PEOPLE.map((p) => p.id).filter((id) => st.byPerson.has(id))
      .concat([...st.byPerson.keys()].filter((id) => !BY_ID[id]));
    const rows = [];
    for (const id of order) {
      const items = [...st.byPerson.get(id).entries()].sort((a, b) => b[1] - a[1]);
      for (const [k, c] of items) {
        const [act, to] = k.split("|");
        rows.push([personName(id), SHORT[act], to === id ? "自己" : personName(to), "× " + c]);
      }
    }
    // 一条一个小胶囊，从下往上依次冒出来
    rows.forEach(([who, act, to, n], i) => {
      const it = document.createElement("div");
      it.className = "it";
      const b = document.createElement("b");
      b.textContent = who;
      const a = document.createElement("span");
      a.textContent = act;
      const t = document.createElement("span");
      t.textContent = to;
      const c = document.createElement("span");
      c.className = "n";
      c.textContent = n;
      it.append(b, a, t, c);
      it.style.setProperty("--d", ((rows.length - 1 - i) * 0.035) + "s");
      box.append(it);
    });
  }
  function updatePill(nudge) {
    const st = todayStats(), pill = $("tipPill");
    if (st.total < TIP_MIN) { pill.classList.remove("show"); $("dayTip").classList.remove("show"); return; }
    pill.textContent = "今日 · " + st.total;
    pill.classList.add("show");
    if ($("dayTip").classList.contains("show")) buildTip(st);
    if (nudge) { pill.classList.remove("nudge"); void pill.offsetWidth; pill.classList.add("nudge"); }
  }
  $("tipPill").addEventListener("click", () => {
    const box = $("dayTip");
    if (box.classList.contains("show")) { box.classList.remove("show"); return; }
    buildTip(todayStats());
    box.classList.add("show");
  });
  document.addEventListener("pointerdown", (e) => {
    if (!e.target.closest("#dayTip,#tipPill")) $("dayTip").classList.remove("show");
  });
  // 新消息进来时刷新胶囊；同一天跨过新门槛只跳一次
  function checkTip() {
    const st = todayStats();
    const lv = [...TIP_NUDGE].reverse().find((n) => st.total >= n) || 0;
    const k = "hc.tip." + todayKey();
    const shown = Number(store.get(k) || 0);
    if (lv > shown) store.set(k, String(lv));
    updatePill(lv > shown);
  }

  const personName = (id) => nickOf(id) || (BY_ID[id] && BY_ID[id].name) || id;

  /* ---------- 引用 ---------- */
  const shortText = (body, n = 40) => {
    const one = String(body).replace(/^\[sticker:([^\]]+)\]$/gm, "[表情包] $1").replace(/\s+/g, " ").trim();
    return one.length > n ? one.slice(0, n) + "…" : one;
  };
  let replyTarget = null, menuMsg = null, pressTimer = null;
  function setReply(m) {
    replyTarget = m;
    $("replyText").textContent = "回复 " + nameOf(m) + "：" + shortText(m.body);
    $("replyBar").classList.add("show");
    input.focus();
  }
  function clearReply() { replyTarget = null; $("replyBar").classList.remove("show"); }
  $("replyClose").addEventListener("click", clearReply);

  function openMenu(m, x, y) {
    menuMsg = m;
    const menu = $("msgMenu");
    menu.classList.add("show");
    const w = menu.offsetWidth, h = menu.offsetHeight;
    menu.style.left = Math.max(8, Math.min(x - w / 2, innerWidth - w - 8)) + "px";
    menu.style.top = Math.max(8, y - h - 12) + "px";
  }
  const closeMenu = () => { $("msgMenu").classList.remove("show"); menuMsg = null; };
  document.addEventListener("pointerdown", (e) => { if (!e.target.closest("#msgMenu")) closeMenu(); }, true);
  $("mmQuote").addEventListener("click", () => { if (menuMsg) setReply(menuMsg); closeMenu(); });
  $("mmCopy").addEventListener("click", () => {
    if (menuMsg && navigator.clipboard) navigator.clipboard.writeText(menuMsg.body).catch(() => {});
    closeMenu();
  });
  // 长按（手机）或右键（电脑）弹出 引用 / 复制
  function attachPress(el, m) {
    el.addEventListener("pointerdown", (e) => {
      clearTimeout(pressTimer);
      const x = e.clientX, y = e.clientY;
      pressTimer = setTimeout(() => openMenu(m, x, y), 450);
    });
    for (const ev of ["pointerup", "pointerleave", "pointercancel", "pointermove"]) {
      el.addEventListener(ev, (e) => {
        if (ev === "pointermove" && Math.abs(e.movementX) + Math.abs(e.movementY) < 4) return;
        clearTimeout(pressTimer);
      });
    }
    el.addEventListener("contextmenu", (e) => { e.preventDefault(); openMenu(m, e.clientX, e.clientY); });
  }

  // 右滑一条消息就引用它（像微信那样）
  function attachSwipe(row, m) {
    const ico = document.createElement("span");
    ico.className = "swipe-ico";
    ico.textContent = "↩";
    row.append(ico);
    let x0 = 0, y0 = 0, dx = 0, active = false, decided = false, horiz = false;
    row.addEventListener("pointerdown", (e) => {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      x0 = e.clientX; y0 = e.clientY; dx = 0; active = true; decided = false; horiz = false;
    });
    row.addEventListener("pointermove", (e) => {
      if (!active) return;
      const mx = e.clientX - x0, my = e.clientY - y0;
      if (!decided) {
        if (Math.abs(mx) < 8 && Math.abs(my) < 8) return;
        decided = true;
        horiz = mx > 0 && Math.abs(mx) > Math.abs(my) * 1.3;
        if (!horiz) { active = false; return; }
        clearTimeout(pressTimer);
        try { row.setPointerCapture(e.pointerId); } catch {}
        row.style.transition = "none";
      }
      dx = Math.max(0, Math.min(mx, 90));
      row.style.transform = "translateX(" + dx + "px)";
      ico.style.opacity = String(Math.min(1, dx / 60));
    });
    const end = () => {
      if (!active) return;
      active = false;
      if (!horiz) return;
      row.style.transition = "transform .2s";
      row.style.transform = "";
      ico.style.opacity = "0";
      if (dx >= 60) { setReply(m); if (navigator.vibrate) navigator.vibrate(10); }
    };
    row.addEventListener("pointerup", end);
    row.addEventListener("pointercancel", end);
  }

  function jumpTo(id) {
    const el = $("list").querySelector('[data-mid="' + id + '"]');
    if (!el) { setStatus("那条太早了，没加载出来"); setTimeout(() => setStatus(null), 2500); return; }
    el.scrollIntoView({ block: "center", behavior: "smooth" });
    el.classList.add("flash");
    setTimeout(() => el.classList.remove("flash"), 1400);
  }

  /* ---------- 渲染 ---------- */
  const tz = { timeZone: "Asia/Singapore" };
  const timeOf = (d) => d.toLocaleTimeString("zh-CN", { ...tz, hour: "2-digit", minute: "2-digit", hour12: false });
  const dayOf = (d) => d.toLocaleDateString("zh-CN", { ...tz, month: "long", day: "numeric", weekday: "short" });
  const nameOf = (m) => nickOf(m.author_id) || m.author_name || (BY_ID[m.author_id] && BY_ID[m.author_id].name) || m.author_id;

  function render(newIds, keepScroll) {
    const sc = $("scroller"), list = $("list");
    const nearBottom = sc.scrollHeight - sc.scrollTop - sc.clientHeight < 140;
    const top = sc.scrollTop;
    const toBottom = !keepScroll && (!newIds || nearBottom);
    list.textContent = "";
    if (!msgs.length) {
      const e = document.createElement("div");
      e.className = "empty";
      e.textContent = "还没有人说话";
      list.append(e);
      return;
    }
    let lastDay = "", prev = null;
    for (const m of msgs) {
      const d = new Date(m.created_at), day = dayOf(d);
      if (day !== lastDay) {
        const s = document.createElement("div");
        s.className = "day";
        s.textContent = day;
        list.append(s);
        lastDay = day;
        prev = null;
      }
      const mine = me && m.author_id === me.id;
      const joined = prev && prev.author_id === m.author_id && d - new Date(prev.created_at) < 3 * 60 * 1000;
      // 一条消息按换行拆成几个短气泡
      const isNew = newIds && newIds.has(m.id);
      const ev = String(m.body).trim().match(EVT);
      if (ev && ACT_BY[ev[1]]) {
        const line = document.createElement("div");
        line.className = "event";
        line.dataset.mid = m.id;
        const steps = eventSteps(nameOf(m), ev[2] === m.author_id ? "自己" : personName(ev[2]), ACT_BY[ev[1]].fx);
        // 新来的动作：先显示“正在发生”，动画结束再更新成结果；旧的直接显示结果
        if (isNew && steps.length > 1) {
          line.textContent = steps[0].t;
          setTimeout(() => { line.textContent = steps[1].t; }, steps[1].at);
        } else line.textContent = steps[steps.length - 1].t;
        list.append(line);
        // 自己发的：顶栏头像点击时已经在动了，列表重画后只补列表里的头像
        if (isNew) setTimeout(() => playFx(ev[2], ev[1], me && m.author_id === me.id), 50);
        prev = null;
        continue;
      }
      const parts = String(m.body).split(/\n+/).map((s) => s.trim()).filter(Boolean);
      if (!parts.length) parts.push(String(m.body));
      parts.forEach((text, i) => {
        const row = document.createElement("div");
        row.className = "msg" + (mine ? " mine" : "") + (joined || i > 0 ? " cont" : "") + (isNew ? " new" : "");
        if (isNew) row.style.animationDelay = (i * 0.12) + "s";
        const av = document.createElement("button");
        av.type = "button";
        av.className = "av";
        av.setAttribute("aria-label", "换头像");
        paintAvatar(av, m.author_id, nameOf(m));
        av.dataset.who = m.author_id;
        av.setAttribute("aria-label", "轻点戳" + nameOf(m) + "，长按更多");
        attachAvatar(av, m.author_id);
        const col = document.createElement("div");
        col.className = "col";
        const name = document.createElement("div");
        name.className = "name";
        name.textContent = nameOf(m);
        const line = document.createElement("div");
        line.className = "line";
        const hit = text.match(STK);
        const stk = hit && stickers[hit[1].trim()];
        // 别人刚加的表情包，这台手机上还没有，就去重新拿一次列表
        if (hit && !stk) refreshStickersSoon();
        if (stk) {
          const img = document.createElement("img");
          img.className = "stk";
          img.src = stk.url;
          img.alt = "[" + hit[1].trim() + "]";
          // 图片加载完会把页面撑高，原本在底部就继续贴底
          if (toBottom) img.addEventListener("load", () => { sc.scrollTop = sc.scrollHeight; });
          attachPress(img, m);
          line.append(img);
        } else {
          const bubble = document.createElement("div");
          bubble.className = "bubble";
          bubble.textContent = text;
          attachPress(bubble, m);
          line.append(bubble);
        }
        if (i === parts.length - 1) {
          const time = document.createElement("span");
          time.className = "time";
          time.textContent = timeOf(d);
          line.append(time);
        }
        col.append(name);
        if (i === 0) {
          row.dataset.mid = m.id;
          if (m.reply) {
            const q = document.createElement("div");
            q.className = "quote";
            q.textContent = (nickOf(m.reply.author_id) || m.reply.author_name) + "：" + m.reply.body;
            q.addEventListener("click", () => jumpTo(m.reply.id));
            col.append(q);
          }
        }
        col.append(line);
        row.append(av, col);
        attachSwipe(row, m);
        list.append(row);
      });
      prev = m;
    }
    if (keepScroll) sc.scrollTop = top;
    else if (toBottom) sc.scrollTop = sc.scrollHeight;
  }

  async function refresh(full) {
    if (!roomId || busy) return;
    busy = true;
    const rid = roomId;
    try {
      const args = full || lastId == null ? { room_id: rid, limit: 100 } : { room_id: rid, after_id: lastId, limit: 100 };
      const r = await call("get_messages", args);
      if (rid !== roomId) return;
      const got = r.messages || [];
      if (full || args.after_id == null) { msgs = got; render(null); checkTip(); }
      else if (got.length) { msgs = msgs.concat(got).slice(-300); render(new Set(got.map((m) => m.id))); checkTip(); }
      if (r.next_after_id != null) lastId = r.next_after_id;
      setStatus(null);
    } catch (e) {
      setStatus(e.auth ? "令牌不对，点右上角设置改一下" : "连不上，稍后自动重试");
    } finally {
      busy = false;
    }
  }

  const startPolling = () => { stopPolling(); timer = setInterval(() => refresh(false), POLL_MS); };
  const stopPolling = () => { clearInterval(timer); timer = null; };
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) stopPolling();
    else if (me) { refresh(false); startPolling(); }
  });

  /* ---------- 发送 ---------- */
  const input = $("input"), send = $("send");
  function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 130) + "px"; }
  input.addEventListener("input", autosize);

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing && matchMedia("(pointer: fine)").matches) {
      e.preventDefault();
      $("composer").requestSubmit();
    }
  });
  async function sendBody(body, fromInput) {
    if (!body || !roomId) return;
    send.disabled = true;
    try {
      const args = { room_id: roomId, body };
      if (replyTarget) args.reply_to = replyTarget.id;
      await call("send_message", args);
      clearReply();
      if (fromInput) { input.value = ""; autosize(); }
      await refresh(false);
    } catch (err) {
      setStatus("没发出去：" + err.message);
    } finally {
      send.disabled = false;
      if (fromInput) input.focus();
    }
  }
  $("composer").addEventListener("submit", (e) => {
    e.preventDefault();
    sendBody(input.value.trim(), true);
  });
  $("stkBtn").addEventListener("click", () => togglePicker());
  input.addEventListener("focus", () => togglePicker(false));

  /* ---------- 设置 ---------- */
  function showSetup(msg) {
    stopPolling();
    $("baseInput").value = cfg.base;
    $("tokenInput").value = "";
    $("setupError").textContent = msg || "";
    $("setup").classList.add("show");
  }
  $("settingsBtn").addEventListener("click", () => showSetup());
  $("saveSetup").addEventListener("click", () => {
    const base = $("baseInput").value.trim() || DEFAULT_BASE;
    const token = $("tokenInput").value.trim() || cfg.token;
    if (!token) { $("setupError").textContent = "令牌要填"; return; }
    cfg = { base, token };
    store.set("hc.base", base);
    store.set("hc.token", token);
    $("setup").classList.remove("show");
    start();
  });

  async function start() {
    setStatus("正在开门…");
    try {
      const r = await call("list_rooms");
      me = r.me;
      roomId = (r.rooms && r.rooms[0] && r.rooms[0].id) || "";
      serverRoomName = (r.rooms && r.rooms[0] && r.rooms[0].name) || "我们家";
      paintTitle();
      lastId = null;
      await refresh(true);
      startPolling();
      loadStickers();
    } catch (e) {
      if (e.auth) showSetup("令牌不对，再看一眼");
      else setStatus("连不上：" + e.message);
    }
  }

  function applySize(n) {
    document.documentElement.style.setProperty("--fs", n + "px");
    document.querySelectorAll("#sizes button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.fs === String(n))));
  }
  applySize(store.get("hc.fs") || "15");
  document.querySelectorAll("#sizes button").forEach((b) => b.addEventListener("click", () => {
    store.set("hc.fs", b.dataset.fs);
    applySize(b.dataset.fs);
  }));
  paintStatic();
  paintTitle();
  if (cfg.token) start(); else showSetup();
}
</script>
</body>
